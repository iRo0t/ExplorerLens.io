name: Compilar LENSShell DLL (método oficial)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Compilar librerias externas (solo primera vez)
        shell: pwsh
        run: |
          # Segun QUICK_START.md, esto prepara external/ antes del Engine
          .\build-scripts\Update-All-Libraries.ps1
          if ($LASTEXITCODE -ne 0) { Write-Error "Update-All-Libraries fallo"; exit 1 }

      - name: Compilar Engine con script oficial (vcvars + cmake + ninja)
        shell: pwsh
        run: |
          # Build-MSVC.ps1 configura el entorno automaticamente
          .\build-scripts\Build-MSVC.ps1 -Clean
          if ($LASTEXITCODE -ne 0) { Write-Error "Build-MSVC.ps1 fallo"; exit 1 }

      - name: Compilar Shell Extension + Manager con MSBuild
        shell: pwsh
        run: |
          msbuild LENSShell.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { Write-Error "msbuild fallo"; exit 1 }

      - name: Verificar y subir LENSShell.dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dll = Get-ChildItem -Path . -Filter "LENSShell.dll" -Recurse | Select-Object -First 1
          if ($null -eq $dll) { Write-Error "No se genero LENSShell.dll"; exit 1 }
          Write-Host "DLL: $($dll.FullName) ($($dll.Length) bytes)"
          dumpbin /exports $dll.FullName
          Copy-Item $dll.FullName -Destination dist -Force

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: LENSShell-DLL-x64
          path: dist/*.dll
