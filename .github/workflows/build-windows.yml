name: Compilar LENSShell DLL Funcional

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v5

      - name: Configurar entorno Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Instalar decodificadores reales con vcpkg
        shell: pwsh
        run: |
          if (Test-Path "vcpkg.json") {
            C:\vcpkg\vcpkg.exe install --triplet x64-windows-static
          } else {
            C:\vcpkg\vcpkg.exe install libwebp libavif libjpeg-turbo zlib libpng --triplet x64-windows-static
          }

      - name: Compilar Engine y LENSShell.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $env:CL = "/WX-"

          # 1. Compilar el motor principal (sin tests)
          cmake -B build-engine -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_CXX_FLAGS="/WX- /EHsc" `
            -DBUILD_TESTING=OFF
          cmake --build build-engine --config Release

          # 2. Compilar exclusivamente el proyecto LENSShell (.vcxproj o .sln)
          $shellProj = Get-ChildItem -Recurse -Filter "*LENSShell*.vcxproj" | Select-Object -First 1
          if ($shellProj) {
            Write-Host "=== COMPILANDO PROYECTO SHELL: $($shellProj.FullName) ===" -ForegroundColor Cyan
            msbuild $shellProj.FullName /p:Configuration=Release /p:Platform=x64 /p:TreatWarningAsError=false /p:VcpkgEnabled=true /p:VcpkgTriplet=x64-windows-static
          } else {
            $sln = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
            if ($sln) {
              Write-Host "=== COMPILANDO TARGET LENSShell EN SLN ===" -ForegroundColor Cyan
              msbuild $sln.FullName /t:LENSShell /p:Configuration=Release /p:Platform=x64 /p:TreatWarningAsError=false /p:VcpkgEnabled=true /p:VcpkgTriplet=x64-windows-static
            }
          }

      - name: Verificar que LENSShell.dll sea valida y funcional
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dlls = Get-ChildItem -Recurse -Filter "*.dll" | Where-Object { $_.FullName -notmatch "\\\.git\\" -and $_.FullName -notmatch "vcpkg" -and $_.FullName -notmatch "\\dist\\" }
          
          if ($dlls.Count -eq 0) {
            Write-Error "No se genero ningun archivo .dll"
            exit 1
          }

          foreach ($dll in $dlls) {
            Write-Host "=== VERIFICANDO EXPORTS DE: $($dll.Name) ($($dll.Length) bytes) ===" -ForegroundColor Green
            dumpbin /exports $dll.FullName
            Copy-Item $dll.FullName -Destination dist -Force
          }

      - name: Subir DLL verificada
        uses: actions/upload-artifact@v5
        with:
          name: LENSShell-DLL-x64
          path: dist/*.dll
