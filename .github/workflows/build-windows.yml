name: Compilar LENSShell DLL (VS2026 instalado en runtime)

on:
  workflow_dispatch:

jobs:
  build:
    # Usamos windows-latest. La instalación de VS 2026 se hace en un paso.
    runs-on: windows-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Instalar Visual Studio 2026 Build Tools
        shell: pwsh
        run: |
          Write-Host "Instalando VS 2026 Build Tools..."
          choco install visualstudio2026buildtools `
            --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --includeRecommended --quiet" `
            -y --ignore-package-exit-codes=3010
          Write-Host "Instalacion de VS 2026 finalizada."

      - name: Configurar entorno de compilacion (VS 2026)
        shell: cmd
        run: |
          # Inicializa explicitamente el entorno de VS 2026 (ruta por defecto de Chocolatey)
          call "C:\Program Files (x86)\Microsoft Visual Studio\18\BuildTools\Common7\Tools\VsDevCmd.bat" -arch=x64
          echo "Entorno de VS 2026 configurado."

      - name: Configurar VCPKG_ROOT
        shell: pwsh
        run: |
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV
          Write-Host "VCPKG_ROOT configurado en: $env:VCPKG_ROOT"

      - name: Instalar dependencias con vcpkg
        shell: pwsh
        run: |
          if (Test-Path "vcpkg.json") {
            C:\vcpkg\vcpkg.exe install --triplet x64-windows-static-md
          } else {
            C:\vcpkg\vcpkg.exe install libwebp libavif libjpeg-turbo zlib libpng libheif libjxl openjpeg freetype libraw zstd lz4 --triplet x64-windows-static-md
          }
          if ($LASTEXITCODE -ne 0) { Write-Error "vcpkg install fallo"; exit 1 }

      - name: Compilar con el script oficial (preset vcpkg-release)
        shell: pwsh
        run: |
          .\build-scripts\Build-MSVC.ps1 -Preset vcpkg-release -Clean
          if ($LASTEXITCODE -ne 0) { Write-Error "Build-MSVC.ps1 fallo"; exit 1 }

      - name: Localizar el DLL generado
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path . -Filter "LENSShell.dll" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $dll) { Write-Error "No se encontro LENSShell.dll"; exit 1 }
          Write-Host "DLL encontrado en: $($dll.FullName) ($($dll.Length) bytes)"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $dll.FullName -Destination dist -Force

      - name: Subir DLL verificada
        uses: actions/upload-artifact@v4
        with:
          name: LENSShell-DLL-x64
          path: dist/*.dll
