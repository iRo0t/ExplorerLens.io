name: Compilar LENSShell DLL Funcional

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v5

      - name: Configurar entorno Visual Studio
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restaurar paquetes NuGet (WTL)
        shell: pwsh
        run: |
          $sln = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1
          if ($sln) {
            nuget restore $sln.FullName
          } else {
            nuget install wtl -Version 10.0.10320 -OutputDirectory packages
          }

      - name: Instalar decodificadores con vcpkg
        shell: pwsh
        run: |
          if (Test-Path "vcpkg.json") {
            C:\vcpkg\vcpkg.exe install --triplet x64-windows-static
          } else {
            C:\vcpkg\vcpkg.exe install libwebp libavif libjpeg-turbo zlib libpng libheif libjxl openjpeg freetype libraw zstd lz4 --triplet x64-windows-static
          }

      - name: Compilar Engine y colocar ExplorerLensEngine.lib en su ruta
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Get-ChildItem -Recurse -Filter "CMakeLists.txt" | ForEach-Object {
            (Get-Content $_.FullName) -replace '/WX\b', '/WX-' | Set-Content $_.FullName
          }

          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DBUILD_TESTING=OFF
          cmake --build build --config Release --target ExplorerLensEngine

          New-Item -ItemType Directory -Force -Path "build\lib\Release" | Out-Null
          Get-ChildItem -Recurse -Path "build" -Filter "ExplorerLensEngine.lib" | Copy-Item -Destination "build\lib\Release\" -Force
          Get-ChildItem "build\lib\Release\"

      - name: Enlazar LENSShell.dll
        shell: pwsh
        run: |
          $env:LIB = "C:\vcpkg\installed\x64-windows-static\lib;" + $env:LIB
          $shellProj = Get-ChildItem -Recurse -Filter "*LENSShell*.vcxproj" | Select-Object -First 1
          msbuild $shellProj.FullName /p:Configuration=Release /p:Platform=x64 /p:TreatWarningAsError=false /p:AdditionalLibraryDirectories="C:\vcpkg\installed\x64-windows-static\lib"

      - name: Verificar que LENSShell.dll sea valida y funcional
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dlls = Get-ChildItem -Recurse -Filter "*.dll" | Where-Object { $_.FullName -notmatch "\\\.git\\" -and $_.FullName -notmatch "vcpkg" -and $_.FullName -notmatch "\\dist\\" -and $_.FullName -notmatch "\\packages\\" }
          
          if ($dlls.Count -eq 0) {
            Write-Error "No se genero ningun archivo .dll"
            exit 1
          }

          foreach ($dll in $dlls) {
            Write-Host "=== VERIFICANDO EXPORTS DE: $($dll.Name) ($($dll.Length) bytes) ===" -ForegroundColor Green
            dumpbin /exports $dll.FullName
            Copy-Item $dll.FullName -Destination dist -Force
          }

      - name: Subir DLL verificada
        uses: actions/upload-artifact@v5
        with:
          name: LENSShell-DLL-x64
          path: dist/*.dll
